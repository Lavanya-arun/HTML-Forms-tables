<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registeration Form</title>
</head>
<body>

    <h1>Student Registeration Form</h1>
    <form action="">
    <label for="">Name:</label>
    <input type="text" placeholder="Enter your name" required>
    <br><br>

    <label for="">Email:</label>
    <input type="email" placeholder="Enter your email" required>
    <br><br>    

    <label for="">Password:</label>
    <input type="password" required>
    <br><br>

    <label for="">Gender:</label>
    <label for="male"><input type="radio" name="gender" id="male" required> Male</label>
    <label for="female"><input type="radio" name="gender" id="female" required> Female</label>
    <br><br>

    <label for="">Skills:</label>
    <label for="html"><input type="checkbox" name="skills" id="html"> HTML</label>
    <label for="css"><input type="checkbox" name="skills" id="css"> CSS</label>
    <label for="js"><input type="checkbox" name="skills" id="js"> JavaScript</label>
    <br><br>    

    <label for="">Date of Birth:</label>
    <input type="date" required>
    <br><br>

    <input type="submit" value="Register">

 </form>
  
 <h1>Submitted Students</h1>
 <table border="1">  
<tr>
<th>Name</th>
<th>Email</th>
<th>Gender</th>
<th>Skills</th>
<th>Date of Birth</th>
</tr>

 </table>


</body>
</html>
